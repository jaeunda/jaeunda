name: Language Metrics

on:
  schedule:
    - cron: "0 0 * * 0" # weekly
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/languages.yml"

jobs:
  language-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: jaeunda
          template: classic
          base: ""

          filename: metrics-languages.svg
          config_timezone: Asia/Seoul

          # Commit author identification
          commits_authoring: >-
            jaeunda,
            jaeunda@gmail.com

          # Language statistics
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6

          # Same exclusions as the current card
          plugin_languages_ignored: >-
            html,
            css,
            scss,
            shell,
            perl

          # Analyze my actual commits from important org repositories too.
          plugin_languages_indepth_custom: >-
            Ongi-Team/ongi-device,
            Team-po/Server,
            gdsc-ssu/CSocrates2,
            weavegate/weavegate

          # Prevent one large repository from blocking the whole workflow
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 3

          # Match the current README palette
          extras_css: |
            svg {
              color: #7a7d72;
            }

            .items-wrapper {
              background: #f6f7f5;
            }

            h1, h2, h3 {
              color: #6b7a5a;
            }

            .field.language {
              color: #2b2e28;
            }

            .field.language.details small {
              color: #7a7d72;
            }
