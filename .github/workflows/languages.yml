name: Language Metrics

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  language-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}

          user: jaeunda
          template: classic
          base: ""

          filename: metrics-languages.svg
          config_timezone: Asia/Seoul

          commits_authoring: >-
            jaeunda,
            jaeunda@gmail.com,
            130204907+jaeunda@users.noreply.github.com

          plugin_languages: yes
          plugin_languages_indepth: yes

          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 6

          plugin_languages_ignored: >-
            html,
            css,
            scss,
            shell,
            perl

          extras_css: |
            svg {
              color: #7a7d72;
            }

            h1, h2, h3 {
              color: #6b7a5a;
            }

            .field.language {
              color: #2b2e28;
            }
